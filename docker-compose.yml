services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: church_bands_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    # A 5432 do host publicada para que o cliente de banco da máquina olhe o
    # mesmo Postgres que a aplicação usa. Enquanto o banco só existia na rede
    # interna do compose, um Postgres instalado na máquina atendia por essa
    # porta, e a tabela consultada no cliente nunca era a que a tela gravava.
    #
    # `DATABASE_PORT` existe pela mesma razão que `APP_PORT` no serviço abaixo:
    # a demonstração de uma release sobe em outro nome de projeto e não pode
    # disputar a 5432 com o ambiente de desenvolvimento.
    ports:
      - "${DATABASE_PORT:-5432}:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      LISTEN_ON_ALL_INTERFACES: "true"
    # `APP_PORT` existe para a demonstração de uma release rodar ao lado do
    # ambiente de desenvolvimento, em outra porta e com outro nome de projeto
    # (`docker compose -p church_bands_demo`), sem disputar a 4000 nem o banco.
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - .:/app
      # Volumes anônimos para que artefatos de build do container não colidam
      # com os da máquina host.
      - /app/_build
      - /app/deps
    # `assets.build` roda a cada subida de propósito: o esbuild em modo --watch
    # só constrói na inicialização e a cada mudança de arquivo, então se o
    # bundle sumir (priv/static/assets/ é ignorado pelo git) nada o regenera e
    # a aplicação fica sem JavaScript nenhum.
    command: sh -c "mix assets.setup && mix assets.build && mix ecto.setup && mix phx.server"

volumes:
  pgdata:
